/* VOICE: livro-caixa de uma casa de crédito discreta — sóbrio, exato, sem enfeite

   COLOUR and TYPE: naval #0A1428 dominante, papel #F5F3EE, ouro #C9A968 só como acento; Playfair + Montserrat (marca)

.t-Emdia{background:light-dark(#E3F2E8,#12301F);color:var(--ok)}.t-Vencehoje{background:light-dark(#FBF0D9,#3A2C0C);color:var(--warn)}
.t-Ematraso{background:light-dark(#FCE6DA,#3B1D10);color:var(--late)}.t-Inadimplente{background:light-dark(#F9DDE5,#3A0F1C);color:var(--bad)}
.t-Parado{background:light-dark(#ECE8F7,#231D3D);color:var(--park)}.t-Quitado,.t-Perdido,.t-Encerrado{background:var(--sf2);color:var(--mut)}.t-Renegociado{background:light-dark(#E1EBF6,#14263D);color:light-dark(#1F4E79,#8DB8E8)}
.sA{color:var(--ok)}.sB{color:var(--warn)}.sC{color:var(--late)}.sD{color:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
.sec{margin:24px 0 10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}.sec h3{font-family:Montserrat,system-ui,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px;flex:1 1 auto;white-space:nowrap}.sec h3::after{content:'';flex:1;height:1px;background:var(--line);min-width:20px}.sec span{font-size:12px;color:var(--mut);text-align:right;flex:0 1 auto}.sec .mnav b{font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}@media(max-width:600px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.card span{font-size:11.5px;color:var(--mut);display:block;margin-bottom:2px}.card b{font-family:"Playfair Display",serif;font-size:21px;font-weight:600;white-space:nowrap}.card em{display:block;font-style:normal;font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.fig{position:relative;height:240px;background:var(--sf);border:1px solid var(--line);border-radius:14px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin:8px 2px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ov{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:50;display:none;justify-content:flex-end;padding-top:env(safe-area-inset-top)}@media(max-width:600px){.ov{background:#0A1428}}
.ov.open{display:flex}.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px max(4vw,18px) calc(env(safe-area-inset-bottom) + 40px);animation:in .22s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}}@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:24px;margin:4px 0 14px;padding-right:60px;min-height:40px;display:flex;align-items:center}.shead{position:sticky;top:0;height:0;display:flex;justify-content:flex-end;z-index:5}.sheet .x{width:46px;height:46px;margin-top:-4px;border-radius:50%;border:1px solid var(--line);background:var(--sf);color:var(--ink);font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}.sheet .x:active{transform:scale(.94)}input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;margin:0}
.stack>*+*{margin-top:12px}
.sim{background:var(--navy);color:#EEE9DB;border-radius:14px;padding:16px}.sim b{font-family:"Playfair Display",serif;color:var(--goldf);font-size:26px}.sim small{color:#AEB5C4;font-size:12px}
.sim .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.sim .g div span{display:block;font-size:11px;color:#AEB5C4}.sim .g div{font-weight:600;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
.note{font-size:13px;color:var(--mut)}.lembrete{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:nowrap;background:var(--sf);border:1px solid var(--line);border-left:3px solid var(--gold);padding:6px 6px 6px 12px;border-radius:10px;font-size:12.5px;color:var(--mut);margin-bottom:10px}.lembrete .btn{min-height:32px!important;padding:5px 12px!important;font-size:12.5px;flex:none}.lembrete:empty{display:none}
.welcome{max-width:560px;margin:8px auto 0;text-align:center}.welcome img{width:96px;height:96px;border-radius:22px;margin:6px auto 14px;display:block}.welcome h2{font-family:"Playfair Display",serif;font-size:28px;margin:0 0 8px}.welcome .opts{display:grid;gap:10px;margin:20px 0}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
.banner{background:light-dark(#FBF0D9,#3A2C0C);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:12px;display:none}
.search{flex:1 1 220px;max-width:340px}
.sched td.pg{color:var(--ok)}.sched td.at{color:var(--late);font-weight:600}
.check{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)}.check input{width:22px;min-height:22px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}table.stack tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}table.stack td{display:block;border:0;padding:0;text-align:start;font-size:14px;font-variant-numeric:tabular-nums}table.stack td::before{content:attr(data-l);display:block;font-size:11px;font-weight:500;color:var(--mut);margin-bottom:1px}table.stack td:first-child{grid-column:1/-1;font-family:'Playfair Display',serif;font-size:17px;font-weight:600}table.stack td:first-child::before{display:none}table.stack td:empty{display:none}}
</style>

{
/* ---------- armazenamento local (IndexedDB) — os dados ficam só neste aparelho ---------- */
const LDB = (() => {
  let idb = null; const mem = new Map(); const subs = new Set();
  const clone = o => JSON.parse(JSON.stringify(o));
  const openIDB = () => new Promise((res, rej) => {
    const r = indexedDB.open('tavares-co', 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('docs')) r.result.createObjectStore('docs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
  });
  const write = ops => new Promise((res, rej) => {
    const tx = idb.transaction('docs', 'readwrite'), st = tx.objectStore('docs');
    for (const [k, v] of ops) v === undefined ? st.delete(k) : st.put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('abort'));
  });
  let queued = false;
  const notify = () => { if (queued) return; queued = true; setTimeout(() => { queued = false; for (const f of subs) { try { f(); } catch (e) { console.error(e); } } }, 0); };
  async function init() {
    idb = await openIDB();
    await new Promise((res, rej) => {
      const c = idb.transaction('docs').objectStore('docs').openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { mem.set(cur.key, cur.value); cur.continue(); } else res(); };
      c.onerror = () => rej(c.error);
    });
  }
  const snapDoc = path => ({ id: path.split('/').pop(), exists: mem.has(path), data: () => mem.get(path), metadata: { fromCache: false } });
  const docRef = path => ({
    id: path.split('/').pop(), path,
    get: async () => snapDoc(path),
    set: async d => { const v = clone(d); await write([[path, v]]); mem.set(path, v); notify(); },
    update: async d => {
      if (!mem.has(path)) { const e = new Error('Documento não existe'); e.code = 'not_found'; throw e; }
      const v = { ...mem.get(path), ...clone(d) }; await write([[path, v]]); mem.set(path, v); notify();
    },
    delete: async () => { await write([[path, undefined]]); mem.delete(path); notify(); },
    onSnapshot: cb => { const f = () => cb(snapDoc(path)); subs.add(f); f(); return () => subs.delete(f); }
  });
  const colDocs = c => { const p = c + '/'; const out = []; for (const [k, v] of mem) if (k.startsWith(p) && k.indexOf('/', p.length) < 0) out.push({ id: k.slice(p.length), exists: true, data: () => v }); return out; };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const db = {
    doc: docRef,
    collection: c => ({
      doc: id => docRef(c + '/' + (id || newId())),
      add: async d => { const r = docRef(c + '/' + newId()); await r.set(d); return r; },
      onSnapshot: cb => { const f = () => { const docs = colDocs(c); cb({ docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false } }); }; subs.add(f); f(); return () => subs.delete(f); }
    })
  };
  return {
    init, db,
    get: path => mem.get(path),
    put: async (path, v) => { await write([[path, clone(v)]]); mem.set(path, clone(v)); },
    size: () => { let n = 0; for (const k of mem.keys()) if (!k.startsWith('meta/')) n++; return n; },
    dump: () => { const o = {}; for (const [k, v] of mem) if (!k.startsWith('meta/')) o[k] = v; return o; },
    restore: async docs => {
      const ops = []; for (const k of mem.keys()) if (!k.startsWith('meta/')) ops.push([k, undefined]);
      for (const [k, v] of Object.entries(docs)) { if (typeof k !== 'string' || !/^[\w-]+\/[\w-]+$/.test(k) || k.startsWith('meta/') || !v || typeof v !== 'object') continue; ops.push([k, clone(v)]); }
      await write(ops);
      for (const [k, v] of ops) v === undefined ? mem.delete(k) : mem.set(k, v);
      notify();
    }
  };
})();

/* rótulos das tabelas empilhadas no celular */
new MutationObserver(() => { for (const c of document.querySelectorAll('.stack td:not([data-l])')) { let i = 0, q = c; while ((q = q.previousElementSibling)) i += q.colSpan; c.dataset.l = c.closest('table').rows[0].cells[i]?.textContent || ''; } }).observe(document.documentElement, { childList: true, subtree: true });
/* ENGINE START */
const DAY = 864e5;
const P = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const ISO = d => d.toISOString().slice(0, 10);
const addD = (d, n) => new Date(d.getTime() + n * DAY);
const addM = (d, n) => { const y = d.getUTCFullYear(), m = d.getUTCMonth() + n, dd = d.getUTCDate(); const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); return new Date(Date.UTC(y, m, Math.min(dd, last))); };
const diff = (a, b) => Math.round((a - b) / DAY);
const isWork = (d, hol) => { const w = d.getUTCDay(); return w > 0 && w < 6 && !hol.has(ISO(d)); };
const nthWork = (y, m, n, hol) => { let d = new Date(Date.UTC(y, m, 1)), c = 0; for (;;) { if (isWork(d, hol)) { c++; if (c === n) return d; } d = addD(d, 1); } };
const FREQ = { diaria: { l: 'Diária', m: 1 / 22 }, semanal: { l: 'Semanal', m: 7 / 30.4375 }, quinzenal: { l: 'Quinzenal', m: 0.5 },
  mensal: { l: 'Mensal', m: 1 }, mensal5: { l: 'Mensal (5º dia útil)', m: 1 }, unico: { l: 'Pagamento único', m: 1 } };
const r2 = x => Math.round(x * 100) / 100;

function schedule(L, hol, count) {
  const s = P(L.primeiroVenc), out = [];
  if (L.freq === 'diaria') { let d = s; while (!isWork(d, hol)) d = addD(d, 1); for (let k = 0; k < count; k++) { out.push(d); do { d = addD(d, 1); } while (!isWork(d, hol)); } return out; }
  for (let k = 0; k < count; k++) {
    if (L.freq === 'semanal') out.push(addD(s, 7 * k));
    else if (L.freq === 'quinzenal') out.push(addD(addM(s, Math.floor(k / 2)), k % 2 ? 15 : 0));
    else if (L.freq === 'mensal5') { const b = addM(new Date(Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), 1)), k); out.push(nthWork(b.getUTCFullYear(), b.getUTCMonth(), 5, hol)); }
    else if (L.freq === 'unico') { out.push(s); break; }
    else out.push(addM(s, k));
  }
  return out;
}

function mesesPorParcela(L) {
  if (L.freq === 'unico') return Math.max(1, Math.round(diff(P(L.primeiroVenc), P(L.data)) / 30));
  return (FREQ[L.freq] || FREQ.mensal).m;
}

/* parcela e total de um contrato parcelado (juros fixo sobre o valor, proporcional ao prazo) */
function simular(valor, taxa, freq, n, data, primeiroVenc) {
  const L = { freq, data, primeiroVenc }; n = freq === 'unico' ? 1 : Math.max(1, n | 0);
  const meses = mesesPorParcela(L) * n, parcela = r2(valor * (1 + taxa * meses) / n), total = r2(parcela * n);
  return { n, meses, total, parcela, juros: r2(total - valor) };
}

function calc(L, pays, cfg, today) {
  const hol = cfg.holSet, rot = L.modalidade === 'rotativo';
  const taxa = +L.taxa || 0, mpp = mesesPorParcela(L);
  let pago = 0, amort = 0, moraPaga = 0, ultimo = null;
  for (const p of pays) { pago += +p.valor || 0; amort += +p.amort || 0; moraPaga += +p.mora || 0; if (!ultimo || p.data > ultimo) ultimo = p.data; }
  const R = { pago, amort, moraPaga, ultimo, rot };
  if (rot) {
    R.principalAberto = Math.max(0, (+L.valor || 0) - amort);
    R.parcela = r2(+L.parcela > 0 ? +L.parcela : R.principalAberto * taxa * mpp);
    const horizon = Math.max(1, Math.ceil(diff(today, P(L.primeiroVenc)) / (mpp * 30.4)) + 6);
    R.sched = schedule(L, hol, Math.min(600, horizon + 2));
    R.n = null; R.total = +L.valor; R.jurosTotal = null;
  } else {
    const n = L.freq === 'unico' ? 1 : Math.max(1, +L.n || 1);
    R.n = n;
    R.parcela = +L.parcela > 0 ? +L.parcela : r2((+L.valor) * (1 + taxa * mpp * n) / n);
    R.total = r2(R.parcela * n); R.jurosTotal = r2(R.total - (+L.valor || 0));
    R.sched = schedule(L, hol, n);
  }
  const credit = rot ? pago : pago + amort;
  const maxK = rot ? R.sched.length : R.n;
  const tol = Math.max(0.1, R.parcela * 0.002);
  R.quitadas = R.parcela > 0 ? Math.min(maxK, Math.floor((credit + tol) / R.parcela)) : 0;
  R.vencidas = R.sched.filter(d => d < today).length;
  if (!rot) R.vencidas = Math.min(R.vencidas, R.n);
  R.hojeK = R.sched.findIndex(d => +d === +today) + 1;
  const parcial = r2(credit - R.quitadas * R.parcela);
  R.atraso = r2(Math.max(0, R.vencidas * R.parcela - credit)); if (R.atraso < tol) R.atraso = 0;
  R.saldo = rot ? r2(R.principalAberto + R.atraso) : r2(Math.max(0, R.total - credit));
  if (!rot) R.principalAberto = R.total > 0 ? r2((+L.valor) * R.saldo / R.total) : 0;
  R.jurosRealizado = rot ? pago : (R.total > 0 ? r2(credit * R.jurosTotal / R.total) : 0);
  const quitado = rot ? R.principalAberto <= 0.005 : R.saldo < tol;
  R.prox = quitado ? null : (R.sched[R.quitadas] || null);
  R.dias = R.atraso > 0.005 && R.prox ? Math.max(0, diff(today, R.prox)) : 0;
  let mora = 0;
  if (R.atraso > 0.005) for (let k = R.quitadas; k < R.vencidas; k++) {
    const owed = R.parcela - (k === R.quitadas ? parcial : 0);
    const d = Math.max(0, diff(today, R.sched[k]) - (cfg.tolerancia || 0));
    let m = owed * cfg.mora * d; if (cfg.teto > 0) m = Math.min(m, cfg.teto * R.parcela); mora += m;

const rnSel = () => { if (!S.rn.sel) S.rn.sel = new Set(S.emp.filter(L => L.cliente === S.rn.cli && R(L.id).saldo > 0.005 && !R(L.id).quitado).map(L => L.id)); return S.rn.sel; };
function rnBase() {
  const sel = rnSel(); let saldo = 0, princ = 0, atraso = 0;
  for (const L of S.emp) if (sel.has(L.id)) { const r = R(L.id); saldo += r.saldo; princ += r.principalAberto; atraso += r.atraso; }
  return { saldo: r2(saldo), princ: r2(princ), atraso: r2(atraso) };
}
function rnCalc() {
  const f = S.rn.f, b = rnBase(), c = cfg();
  const entrada = Math.min(b.saldo, +f.entrada || 0), desconto = +f.desconto || 0, acrescimo = +f.acrescimo || 0, taxa = (f.taxa === undefined || f.taxa === '' ? 0 : +f.taxa) / 100;
  const freq = f.freq || 'mensal', data = TISO, primeiroVenc = f.primeiroVenc || nextVenc(freq, data);
  const base = r2(Math.max(0, b.saldo - entrada + acrescimo - desconto));
  const L = { freq, data, primeiroVenc };
  const mpp = freq === 'unico' ? Math.max(1, Math.round((P(primeiroVenc) - P(data)) / 864e5 / 30)) : FREQ[freq].m;
  let n = freq === 'unico' ? 1 : Math.max(1, Math.floor(+f.n || 1));
  const desejada = +f.parcelaDesejada || 0;
  if (desejada > 0 && freq !== 'unico') { for (n = 1; n < 600; n++) { if (base * (1 + taxa * mpp * n) / n <= desejada + 0.005) break; } }
  const parcela = r2(base * (1 + taxa * mpp * n) / n), total = r2(parcela * n);
  const sched = schedule({ freq, primeiroVenc }, cfg().holSet, n);
  const principal = r2(b.saldo > 0 ? b.princ * (b.saldo - entrada) / b.saldo : 0);
  return { b, entrada, desconto, acrescimo, taxa, freq, primeiroVenc, base, n, parcela, total, sched, principal, juros: r2(total - base), dif: r2(total + entrada - b.saldo) };
}

async function rnConfirm(btn) {
  if (!S.db) return toast('Sem conexão com o banco.');
  const x = rnCalc(), sel = [...rnSel()]; if (!sel.length || x.base <= 0) return toast('Selecione contratos com saldo.');
  if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = `Confirmar: ${x.n} × ${R$(x.parcela)}`; return; }
  btn.disabled = true; const f = S.rn.f; CTX = { acao: 'Renegociação de ' + cliNome(S.rn.cli), lote: Math.random().toString(36).slice(2, 10) };
  const olds = S.emp.filter(L => sel.includes(L.id)).sort((a, b) => a.primeiroVenc.localeCompare(b.primeiroVenc));
  try {
    let resto = x.entrada; const entradas = [], trans = {};
    for (const L of olds) { const r = R(L.id); const pay = r2(Math.min(resto, r.saldo)); trans[L.id] = r2(r.saldo - pay);
      if (pay > 0) { const ref = await col('pagamentos').add({ emp: L.id, data: TISO, valor: pay, mora: 0, amort: 0, forma: f.forma || 'Pix', obs: 'Entrada da renegociação', criado: new Date().toISOString() }); entradas.push(ref.id); resto = r2(resto - pay); } }
    const desc = olds.map(L => { const r = R(L.id); return (r.n > 1 ? r.n + '×' + R$(r.parcela) : R$(r.saldo + 0)) ; }).join(' + ');
    const ref = await col('emprestimos').add({ cliente: S.rn.cli, valor: x.principal, data: TISO, modalidade: 'parcelado', freq: x.freq, n: x.n, primeiroVenc: x.primeiroVenc, taxa: x.taxa, parcela: x.parcela, situacao: 'renegociado',
      obs: `Renegociação de ${olds.length} contrato(s) (${desc}). ${f.obs || ''}`.trim(), criado: new Date().toISOString(),
      reneg: { data: TISO, origem: olds.map(L => L.id), entradas, saldoAnterior: x.b.saldo, entrada: x.entrada, acrescimo: x.acrescimo, desconto: x.desconto } });
    for (const L of olds) await col('emprestimos').doc(L.id).update({ situacao: 'substituido', sitAnterior: L.situacao || 'ativo', renegPara: ref.id, renegData: TISO, saldoTransferido: trans[L.id] });
    toast('Renegociação registrada'); S.rn = { cli: null, sel: null, q: '', f: {} }; location.hash = 'emprestimos'; S.filtro = 'ativos';
  } catch (e) { toast('Falha ao gravar a renegociação. Confira os contratos do cliente.'); btn.disabled = false; }
  finally { CTX = null; }
}
async function rnUndo(id) {
  const L = S.emp.find(e => e.id === id); if (!L?.reneg) return;
  if (S.pag.some(p => p.emp === id)) return toast('Exclua os pagamentos do contrato novo antes.');
  const ok = await W(async () => {
    for (const oid of L.reneg.origem) { const o = S.emp.find(e => e.id === oid); if (o) await col('emprestimos').doc(oid).update({ situacao: o.sitAnterior || 'ativo', renegPara: null, renegData: null, saldoTransferido: null, sitAnterior: null }); }
    for (const pid of L.reneg.entradas || []) await col('pagamentos').doc(pid).delete();

}

function nextVenc(freq, data) {
  const d = P(data || TISO);
  if (freq === 'diaria') { let x = addD(d, 1); while (!isWork(x, cfg().holSet)) x = addD(x, 1); return ISO(x); }
  if (freq === 'semanal') return ISO(addD(d, 7)); if (freq === 'quinzenal') return ISO(addD(d, 15));
  if (freq === 'mensal5') { const b = addM(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)), 1); return ISO(nthWork(b.getUTCFullYear(), b.getUTCMonth(), 5, cfg().holSet)); }
  return ISO(addM(d, 1));
}

async function salvarArquivo(nome, texto, tipo) {
  const blob = new Blob([texto], { type: tipo });
  try { const file = new File([blob], nome, { type: tipo });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nome }); return true; } }
  catch (e) { if (e?.name === 'AbortError') { toast('Cancelado'); return false; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000); return true;
}
const COLS = ['clientes', 'emprestimos', 'pagamentos', 'caixa', 'fechamentos', 'pes_lanc', 'pes_inv', 'historico', 'config'];
function lerBackup(txt) {
  const o = JSON.parse(txt); let docs = o?.docs;
  if (!docs && o && typeof o === 'object') { // backup da versão anterior: listas por coleção
    docs = {}; const map = { clientes: 'clientes', emprestimos: 'emprestimos', pagamentos: 'pagamentos', caixa: 'caixa', fechamentos: 'fechamentos', pessoal_lancamentos: 'pes_lanc', pessoal_investimentos: 'pes_inv', historico: 'historico' };
    for (const [k, c] of Object.entries(map)) for (const d of o[k] || []) { const { id, ...r } = d; if (id) docs[c + '/' + id] = r; }
    if (o.config) { const { holSet, ...r } = o.config; docs['config/geral'] = r; } if (o.config_pessoal) docs['config/pessoal'] = o.config_pessoal;
  }
  if (!docs || typeof docs !== 'object') throw new Error('formato');
  const n = c => Object.keys(docs).filter(k => k.startsWith(c + '/')).length;
  if (!n('emprestimos') && !n('clientes') && !n('config')) throw new Error('vazio');
  return { docs, exportado: o.exportado || null, n };
}

  else if (d.hclear !== undefined) { S.h.doc = null; S.h.cli = null; render(); }
  else if (t.id === 'hcsv' || t.id === 'hcsvc') {

  else if (d.rnundo) { if (t.dataset.sure) await rnUndo(d.rnundo); else { t.dataset.sure = 1; t.textContent = 'Toque de novo para desfazer'; } }

  else if (d.addct) { const box = document.querySelector(`.cted[data-ct="${d.addct}"]`); box.insertAdjacentHTML('beforeend', ctRow()); box.lastElementChild.querySelector('[name=ct_nome]').focus(); }
  else if (d.rmct !== undefined) { const box = t.closest('.cted'); if (box.querySelectorAll('.ctrow').length > 1) t.closest('.ctrow').remove(); else toast('Precisa de pelo menos uma conta.'); }
  else if (d.paporte) { render.reopen = null; sheetPL('aporte', null, d.paporte); }

  else if (d.pmes) { const [y, m] = (S.pesMes || TISO.slice(0, 7)).split('-').map(Number); const n = new Date(Date.UTC(y, m - 1 + (+d.pmes), 1)); S.pesMes = ISO(n).slice(0, 7); render(); }

  else if (d.outros) { const f = $('#ffec'); f.elements.outros.value = d.outros; fecPreview(); }
  else if (d.delFec) { if (t.dataset.sure) { if (await W(() => col('fechamentos').doc(d.delFec).delete(), 'Fechamento excluído')) close(); } else { t.dataset.sure = 1; t.textContent = 'Toque de novo para excluir'; } }
  else if (t.id === 'calcMora') {
    const f = $('#fpag'), c = cfg(), base = +f.elements.valor.value || 0, dias = Math.max(0, Math.floor(+f.elements.dias.value || 0));
    let m = base * c.mora * dias; const capped = c.teto > 0 && m > c.teto * base; if (capped) m = c.teto * base; m = r2(m);

  else if (d.delEmp) { if (t.dataset.sure) { const ps = S.pag.filter(p => p.emp === d.delEmp); if (await W(async () => { for (const p of ps) await col('pagamentos').doc(p.id).delete(); await col('emprestimos').doc(d.delEmp).delete(); }, 'Empréstimo excluído')) { close(); render.reopen = null; } } else { t.dataset.sure = 1; t.textContent = 'Toque de novo para excluir (apaga os pagamentos)'; } }

  else if (d.delMov) { if (await W(() => col('caixa').doc(d.delMov).delete(), 'Movimento excluído')) close(); }
  else if (d.emp) { const id = d.emp; render.reopen = () => sheetEmp(id); sheetEmp(id); }
  else if (d.cli) { const id = d.cli; render.reopen = null; sheetCli(id); }
  else if (d.mov) { sheetMov(d.mov); }
  else if (t.id === 'bkp' || t.id === 'bkpc') {
    const data = JSON.stringify({ app: 'tavares-co', versao: 1, exportado: new Date().toISOString(), docs: LDB.dump() });
    if (t.id === 'bkpc') { try { await navigator.clipboard.writeText(data); toast('Backup copiado'); } catch (e) { toast('Não foi possível copiar'); } return; }
    if (await salvarArquivo(`tavares-backup-${TISO}.json`, data, 'application/json')) { await LDB.put('meta/app', { ...(LDB.get('meta/app') || {}), ultimoBackup: new Date().toISOString() }); toast('Backup gerado'); render(); }
  }
  else if (d.restoreOk !== undefined) restaurar();
  else if (d.zero !== undefined) { if (await W(() => dref('config', 'geral').set(Object.fromEntries(Object.entries(DEF).filter(([k]) => k !== 'holSet'))), 'Pronto. Comece cadastrando clientes e empréstimos.')) location.hash = 'inicio'; }
});
function onCliChange() { const f = $('#femp'); if (!f) return; const v = f.elements.cliente.value; $('#novoCliWrap').style.display = v === '__novo' ? 'block' : 'none';
  if (v && v !== '__novo' && !f.dataset.id) { const c = cliById(v); f.elements.taxa.value = +(((c?.vip ? cfg().taxaVip : cfg().taxa)) * 100).toFixed(2); simUpdate(); } }
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; render(); }
  else if (e.target.id === 'qc') { S.qc = e.target.value; render(); }
  else if (e.target.closest('#ffec')) fecPreview();
  else if (e.target.closest('#rnform')) { const nm = e.target.name; S.rn.f[nm] = e.target.value; if (nm === 'primeiroVenc') S.rn.f._pv = 1; if (nm === 'freq' && !S.rn.f._pv) { const v = e.target.value === 'unico' ? ISO(addM(TODAY, 1)) : nextVenc(e.target.value, TISO); S.rn.f.primeiroVenc = v; $('#rnform [name=primeiroVenc]').value = v; } rnUpdate(); }
  else if (e.target.id === 'rnq') { S.rn.q = e.target.value; render(); }
  else if (e.target.id === 'hq') { S.h.q = e.target.value; render(); }
  else if (e.target.id === 'hmes') { S.h.mes = e.target.value; render(); }
  else if (e.target.closest('#femp')) { if (e.target.name === 'cliente') onCliChange(); if (e.target.name === 'freq' || e.target.name === 'data') { const f = $('#femp'); if (!f.dataset.id) f.elements.primeiroVenc.value = f.elements.freq.value === 'unico' ? ISO(addM(P(f.elements.data.value || TISO), 1)) : nextVenc(f.elements.freq.value, f.elements.data.value); } simUpdate(); }
});
document.addEventListener('change', async e => {
  if (e.target.dataset.sit) { const id = e.target.dataset.sit; await W(() => col('emprestimos').doc(id).update({ situacao: e.target.value }), 'Situação atualizada'); }
  else if (e.target.name === 'cliente' && e.target.closest('#femp')) onCliChange();
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, g = n => f.elements[n]?.value ?? '';

    let cid = g('cliente');
    if (cid === '__novo') { const nome = g('novoCli').trim(); if (!nome) return toast('Informe o nome do cliente.'); if (S.cli.some(c => c.nome.toLowerCase() === nome.toLowerCase())) return toast('Já existe cliente com esse nome.');
      if (!S.db) return toast('Sem conexão com o banco.'); try { const ref = await col('clientes').add({ nome, vip: false, sit: 'ativo', criado: TISO }); cid = ref.id; } catch (er) { return toast('Falha ao criar cliente.'); } }

      primeiroVenc: g('primeiroVenc'), taxa: num(g('taxa')) / 100, parcela: num(g('parcela')), obs: g('obs').trim() };
    if (f.elements.conta) body.conta = g('conta');
    if (!(body.valor > 0)) return toast('Informe o valor.');
    const id = f.dataset.id;
    if (await W(() => id ? col('emprestimos').doc(id).update(body) : col('emprestimos').add({ ...body, situacao: 'ativo', criado: new Date().toISOString() }), id ? 'Empréstimo atualizado' : 'Empréstimo registrado')) { close(); render.reopen = null; }
  } else if (f.id === 'fpag') {
    const body = { emp: f.dataset.eid, data: g('data'), valor: num(g('valor')), mora: num(g('mora')), amort: num(g('amort')), forma: g('forma'), conta: g('conta') || CT_E()[0].id, obs: g('obs').trim(), criado: new Date().toISOString() };
    if (body.valor + body.mora + body.amort <= 0) return toast('Informe um valor.');
    if (await W(() => col('pagamentos').add(body), 'Recebimento registrado')) { close(); render.reopen = null; }
  } else if (f.id === 'fcli') {
    const nome = g('nome').trim(); if (!nome) return toast('Informe o nome.'); const id = f.dataset.id;
    if (S.cli.some(c => c.id !== id && c.nome.toLowerCase() === nome.toLowerCase())) return toast('Já existe cliente com esse nome.');
    const body = { nome, tel: g('tel').trim(), cpf: g('cpf').trim(), end: g('end').trim(), ref: g('ref').trim(), indic: g('indic').trim(), ocup: g('ocup').trim(), renda: num(g('renda')), garantia: g('garantia').trim(), vip: f.elements.vip.checked, sit: g('sit'), obs: g('obs').trim() };
    if (await W(() => id ? col('clientes').doc(id).update(body) : col('clientes').add({ ...body, criado: TISO }), id ? 'Cliente atualizado' : 'Cliente cadastrado')) { close(); }
  } else if (f.id === 'fmov') {
    const body = { tipo: g('tipo'), data: g('data'), valor: num(g('valor')), desc: g('desc').trim(), conta: g('conta') }; const id = f.dataset.id;
    if (!(body.valor > 0)) return toast('Informe o valor.');
    if (body.tipo === 'aporte' || body.tipo === 'retirada') body.contaPes = g('contaPes');
    if (body.tipo === 'transf') { body.contaDest = g('contaDest'); if (body.contaDest === body.conta) return toast('Escolha contas diferentes.'); }
    if (await W(() => id ? col('caixa').doc(id).update(body) : col('caixa').add(body), 'Movimento salvo')) close();
  } else if (f.id === 'fpl') {
    const tipo = g('tipo'), id = f.dataset.id, body = { tipo, data: g('data'), valor: num(g('valor')), desc: g('desc').trim() };

    if (f.elements.conta) body.conta = g('conta');
    if (tipo === 'transf') { body.contaDest = g('contaDest'); if (body.contaDest === body.conta) return toast('Escolha contas diferentes.'); }

    const novoSaldo = g('saldo');

  } else if (f.id === 'fpcfg') {

    if (!(valor > 0)) return toast('Informe o valor.'); if (a === b && ca === cb) return toast('Escolha contas diferentes.');
    const ok = await W(() => a === 'e' && b === 'e' ? col('caixa').add({ tipo: 'transf', conta: ca, contaDest: cb, valor, data, desc })
      : a === 'p' && b === 'p' ? col('pes_lanc').add({ tipo: 'transf', conta: ca, contaDest: cb, valor, data, desc, criado: new Date().toISOString() })
      : a === 'e' ? col('caixa').add({ tipo: 'retirada', conta: ca, contaPes: cb, valor, data, desc })
      : col('caixa').add({ tipo: 'aporte', conta: cb, contaPes: ca, valor, data, desc }), 'Transferência registrada');
    if (ok) close();
  } else if (f.id === 'ffec') {

    const body = { mes, data: TISO, caixa: r2(C.caixa), aReceber: r2(C.aReceber), principal: r2(C.principal), parado: r2(C.parado), outros: num(g('outros')), capitalTotal: r2(C.total),
      recebido: r2(st.rec), emprestado: r2(st.conc), juros: r2(st.juros), obs: g('obs').trim(), origem: 'app' };

    const fer = g('feriados').split(/\s+/).map(s => s.trim()).filter(s => /^\d{4}-\d{2}-\d{2}$/.test(s));

/* ---------- conexão ---------- */
render();
const sync = (cls, txt) => { const s = $('#sync'); s.className = 'sync ' + cls; s.querySelector('span').textContent = txt; };
const ban = t => { const b = $('#banner'); b.textContent = t; b.style.display = t ? 'block' : 'none'; };
(async () => {
  try { await LDB.init(); } catch (e) { console.error(e); sync('err', 'erro'); ban('Não foi possível abrir o armazenamento deste aparelho. Feche o app e abra de novo pelo ícone da tela inicial.'); return; }
  const db = LDB.db; S.db = db;
  let agendado = 0; const rr = () => { if (agendado) return; agendado = requestAnimationFrame(() => { agendado = 0; render(); }); };
  const sub = (name, key) => db.collection(name).onSnapshot(snap => { S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })); rr(); });
  sub('clientes', 'cli'); sub('emprestimos', 'emp'); sub('pagamentos', 'pag'); sub('caixa', 'cx'); sub('fechamentos', 'fec'); sub('pes_lanc', 'pl'); sub('pes_inv', 'inv'); sub('historico', 'hist');
  db.doc('config/pessoal').onSnapshot(s => { S.pcfg = s.exists ? s.data() : null; rr(); });
  db.doc('config/geral').onSnapshot(s => { S.cfg = s.exists ? s.data() : null; rr(); });
  S.pronto = true; sync('on', 'local'); render();
  try { if (navigator.storage?.persist) S.persist = (await navigator.storage.persisted()) || (await navigator.storage.persist()); if (navigator.storage?.estimate) S.uso = (await navigator.storage.estimate()).usage; } catch (e) {}
  if (route() === 'ajustes') render();
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const tinhaSW = !!navigator.serviceWorker.controller; let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (tinhaSW && !recarregou) { recarregou = true; location.reload(); } });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {}));
}
}
