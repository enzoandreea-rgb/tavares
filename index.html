#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;align-content:center;background:#04080F;color:#EEE9DB;cursor:pointer;overflow:hidden;-webkit-user-select:none;user-select:none;transition:opacity .7s ease .15s,visibility .85s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-bg{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 40%,#182a52 0%,#0A1428 45%,#03060D 100%);opacity:0;animation:spFade 1.4s ease .2s forwards}
.sp-rays{position:absolute;left:50%;top:40%;width:170vmax;height:170vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(214,182,112,.075) 0deg 2.5deg,rgba(214,182,112,0) 3.5deg 11deg);-webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 9%,rgba(0,0,0,.15) 20%,transparent 30%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.55) 9%,rgba(0,0,0,.15) 20%,transparent 30%);filter:blur(1.5px);opacity:0;transition:opacity 1.6s ease;animation:spSpin 40s linear infinite}#splash.pousou .sp-rays{opacity:1}
#spc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sp-flash{position:absolute;left:51.5625%;top:40%;width:120vmax;height:120vmax;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:radial-gradient(circle,rgba(255,243,210,.85) 0%,rgba(232,200,130,.45) 10%,rgba(201,169,104,.1) 28%,transparent 50%);opacity:0;mix-blend-mode:screen;pointer-events:none}#splash.pousou .sp-flash{animation:spFlash 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.sp-ring{position:absolute;left:var(--px,50%);top:var(--py,45%);width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid rgba(232,205,140,.9);box-shadow:0 0 24px rgba(232,205,140,.6),inset 0 0 18px rgba(232,205,140,.4);opacity:0;pointer-events:none}.sp-ring.r2{border-width:1px}#splash.pousou .sp-ring{animation:spRing 1.2s cubic-bezier(.1,.7,.2,1) forwards}#splash.pousou .sp-ring.r2{animation-delay:.14s}
.sp-stage{perspective:1000px;width:min(76vw,440px);aspect-ratio:520/364;position:relative;margin-top:-7vh;z-index:2}
.sp-tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s ease-out}
.sp-obj{position:absolute;inset:0;transform-style:preserve-3d;opacity:0;transition:opacity .2s ease}#splash.pousou3d .sp-obj{opacity:1;animation:spIdle 6.5s ease-in-out .9s infinite}.sp-letters{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;filter:blur(12px);transform:translateY(16px) scale(.96);animation:spLetIn 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards;transition:opacity .35s}#splash.pousou .sp-letters{animation:spLetIn 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards,spBump .5s ease-out forwards}#splash.pousou3d .sp-letters,#splash.pousou3d .sp-bird{opacity:0!important;transition:opacity .2s ease .1s}.sp-bird{position:absolute;transform-origin:55% 95%;will-change:transform;opacity:0;transition:opacity .35s}.sp-bird img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}.sp-wing{position:absolute;transform-origin:95% 92.9%;will-change:transform}.sp-wing svg{width:100%;height:100%;display:block;overflow:visible}.sp-wing.near{animation:flapN .30s ease-in-out infinite}.sp-wing.far{filter:brightness(.62);animation:flapF .30s ease-in-out -.05s infinite}.sp-bird.flare .sp-wing{animation:none;transform:rotate(-34deg) scaleY(1.05);transition:transform .18s ease-out}.sp-bird.landed .sp-wing{animation:wingFold .42s cubic-bezier(.5,0,.2,1) forwards}
.sp-obj img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-backface-visibility:visible;backface-visibility:visible}
.sp-front{transform:translateZ(.5px);filter:drop-shadow(0 0 1px rgba(255,236,190,.5)) brightness(1.06)}
.sp-sheen{position:absolute;inset:0;transform:translateZ(1px);-webkit-mask:var(--mono) center/contain no-repeat;mask:var(--mono) center/contain no-repeat;background:linear-gradient(110deg,transparent 30%,rgba(255,252,236,0) 42%,rgba(255,252,236,.95) 50%,rgba(255,252,236,0) 58%,transparent 70%);background-size:320% 100%;background-position:130% 0;mix-blend-mode:screen}#splash.pousou3d .sp-sheen{animation:spSheen 1.5s ease-in-out .2s forwards}
.sp-floor{width:min(56vw,320px);height:26px;margin-top:2vh;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.7),rgba(0,0,0,0));opacity:0;transform:scaleX(.3);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);z-index:1}#splash.pousou .sp-floor{opacity:1;transform:none}
.sp-word{margin-top:3.2vh;text-align:center;z-index:2}
.sp-word b{display:block;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:clamp(32px,9vw,50px);letter-spacing:.05em;white-space:nowrap}
.sp-word b span{display:inline-block;background:linear-gradient(180deg,#FBEFC9 0%,#D9B86E 48%,#8C6A2A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;filter:blur(10px);transform:translateY(22px) rotateX(70deg);transform-origin:50% 100%;animation:spLetter .9s cubic-bezier(.2,.9,.2,1) calc(3.3s + var(--i) * .055s) forwards}
.sp-word i{display:block;height:1px;width:0;margin:12px auto 10px;background:linear-gradient(90deg,transparent,#E9CF8E,transparent);box-shadow:0 0 12px rgba(233,207,142,.8);animation:spLine 1.1s cubic-bezier(.6,0,.2,1) 3.95s forwards}
.sp-word span.tg,.sp-word>span{display:inline-block;font-size:11.5px;text-transform:uppercase;color:#AEB5C4;letter-spacing:1.1em;opacity:0;animation:spTag 1.3s cubic-bezier(.2,.8,.2,1) 4.1s forwards}
.sp-tap{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));font-size:12px;color:#7F889B;letter-spacing:.1em;opacity:0;animation:spTapIn .6s ease 4.6s forwards,spBlink 2.4s ease-in-out 5.2s infinite}
#splash.out .sp-tilt{animation:spOut .7s cubic-bezier(.6,0,.8,.4) forwards}#splash.out .sp-word{transition:opacity .4s,transform .6s;opacity:0;transform:translateY(-12px)}
body.app-in main,body.app-in nav.tabs,body.app-in .top{animation:appIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes appIn{from{opacity:0;transform:scale(.97) translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spRaysIn{to{opacity:1}}
@keyframes spSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes spRing{0%{opacity:0;transform:scale(.4)}12%{opacity:1}100%{opacity:0;transform:scale(22)}}
@keyframes spFly{0%{opacity:0;transform:translateZ(-1400px) rotateY(-600deg) rotateX(28deg) scale(.5)}35%{opacity:1}100%{opacity:1;transform:translateZ(0) rotateY(-16deg) rotateX(7deg) scale(1)}}
@keyframes spIdle{0%,100%{transform:none}25%{transform:rotateY(-18deg) rotateX(6deg)}75%{transform:rotateY(18deg) rotateX(-3deg) translateY(-3px)}}@keyframes spLetIn{to{opacity:1;filter:none;transform:none}}@keyframes spBump{0%{transform:none}35%{transform:translateY(3px) scaleY(.985)}100%{transform:none}}@keyframes flapN{0%,100%{transform:rotate(-30deg) scaleY(1)}50%{transform:rotate(52deg) scaleY(.42)}}@keyframes flapF{0%,100%{transform:translate(-4%,-6%) rotate(-38deg) scaleY(.95)}50%{transform:translate(-4%,-6%) rotate(40deg) scaleY(.4)}}@keyframes wingFold{from{transform:rotate(-34deg) scaleY(1.05);opacity:1}to{transform:rotate(78deg) scale(.18);opacity:0}}
@keyframes spOut{from{opacity:1;transform:rotateY(-6deg) scale(1)}to{opacity:0;transform:translateZ(420px) rotateY(10deg) scale(1.35);filter:blur(6px)}}
@keyframes spSheen{from{background-position:130% 0}to{background-position:-40% 0}}
@keyframes spLetter{to{opacity:1;filter:blur(0);transform:none}}
@keyframes spLine{to{width:min(60vw,290px)}}
@keyframes spTag{to{opacity:1;letter-spacing:.42em}}
@keyframes spTapIn{to{opacity:1}}@keyframes spBlink{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.sp-obj{animation:none!important;opacity:1;transform:rotateY(-14deg) rotateX(6deg)}.sp-letters,.sp-bird{display:none}.sp-rays,.sp-flash,.sp-ring{display:none}.sp-bg,.sp-floor{animation:none;opacity:1}.sp-word b span{animation:none;opacity:1;filter:none;transform:none}.sp-word i{animation:none;width:min(60vw,290px)}.sp-word>span{animation:none;opacity:1;letter-spacing:.42em}.sp-tap{animation:none;opacity:1}.sp-sheen{animation:none}}
/* VOICE: livro-caixa de uma casa de crédito discreta — sóbrio, exato, sem enfeite
   IDEA: o caderno de cobrança do dia; a capa é azul-naval com o cardeal dourado
   PICTURE: o número "a receber hoje" grande, e a fila de cobrança logo abaixo
   COLOUR and TYPE: naval #0A1428 dominante, papel #F5F3EE, ouro #C9A968 só como acento; Playfair + Montserrat (marca)
   LAYOUT: faixa naval no topo com o total do dia; abas; listas em uma coluna; folhas laterais para detalhes */
:root{color-scheme:light dark;
--bg:light-dark(#F5F3EE,#070D1A);--sf:light-dark(#FFFFFF,#0F1A2E);--sf2:light-dark(#EFEBE2,#16233B);
--ink:light-dark(#0A1428,#EEE9DB);--mut:light-dark(#5F6675,#9AA3B5);--line:light-dark(#E2DDD1,#24324D);
--navy:#0A1428;--gold:light-dark(#9C7A35,#C9A968);--goldf:#C9A968;

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}

.top{background:var(--navy);color:#EEE9DB;padding:calc(8px + env(safe-area-inset-top)) max(4vw,16px) 0}
.brand{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}
.brand img{width:48px;height:38px;object-fit:cover;border-radius:6px}
.brand b{white-space:nowrap;font-family:"Playfair Display",serif;font-size:clamp(17px,4.4vw,20px);color:var(--goldf);font-weight:600;letter-spacing:.2px}
.brand small{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#AEB5C4;white-space:nowrap}
.brand .sp{flex:1}
.gear{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;color:#C9A968}.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}.gear:hover{background:#13213A}.gear.on{background:#13213A;box-shadow:inset 0 -2px 0 #C9A968}
.hday{font-size:12px;font-weight:700;color:var(--mut);margin:18px 2px 6px}.row.hrow{grid-template-columns:44px minmax(0,1fr) auto;align-items:start}.hrow .hr{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;padding-top:2px;align-self:start}.hc{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin-right:6px;vertical-align:1px;background:var(--sf2);color:var(--mut)}.hc-receb{background:light-dark(#E3F2E8,#12301F);color:var(--ok)}.hc-emp{background:light-dark(#FBF0D9,#3A2C0C);color:var(--warn)}.hc-reneg{background:light-dark(#E1EBF6,#14263D);color:light-dark(#1F4E79,#8DB8E8)}.hc-caixa{background:light-dark(#FCE6DA,#3B1D10);color:var(--late)}.hc-pessoal{background:light-dark(#ECE8F7,#231D3D);color:var(--park)}.hc-capital{background:light-dark(#F3ECDC,#2E2716);color:light-dark(#7A5E1E,#D9BE80)}.htools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:12px 0}.htools select,.htools input{min-height:44px}.lnk{background:none;border:0;padding:0;font:inherit;color:var(--gold);text-decoration:underline;cursor:pointer;min-height:0}@media(max-width:480px){.row.hrow{grid-template-columns:40px minmax(0,1fr)}.row.hrow .val{grid-column:2;text-align:left}}.hdiff td{vertical-align:top}.hdiff .de{color:var(--mut);text-decoration:line-through}.hdet{white-space:pre-line}
.mrow{grid-template-columns:minmax(0,1fr) auto;align-items:start}.mrow.cur{background:var(--sf2)}.mrow .val{padding-top:2px}.mbar{display:flex;height:8px;border-radius:5px;background:light-dark(#E9F4EE,#12301F);overflow:hidden;margin:8px 0 6px;max-width:520px}.mbar i{display:block;height:100%}.mbar .c,.d.c{background:var(--late)}.mbar .a,.d.a{background:var(--gold)}.mbar .o,.d.o{background:var(--mut)}.d.r{background:var(--ok)}.mleg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--mut)}.mleg span{white-space:nowrap}.d{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

.hm-hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#0A1428 0%,#111F39 60%,#1A2B4A 100%);color:#EEE9DB;border-radius:18px;padding:14px 14px 14px 16px;margin:0 0 16px;border:1px solid #22324F;box-shadow:0 10px 30px -18px rgba(0,0,0,.6)}

const rnSel = () => { if (!S.rn.sel) S.rn.sel = new Set(S.emp.filter(L => L.cliente === S.rn.cli && R(L.id).saldo > 0.005 && !R(L.id).quitado).map(L => L.id)); return S.rn.sel; };
function rnBase() {
  const sel = rnSel(); let saldo = 0, princ = 0, atraso = 0;
  for (const L of S.emp) if (sel.has(L.id)) { const r = R(L.id); saldo += r.saldo; princ += r.principalAberto; atraso += r.atraso; }
  return { saldo: r2(saldo), princ: r2(princ), atraso: r2(atraso) };
}
function rnCalc() {
  const f = S.rn.f, b = rnBase(), c = cfg();
  const entrada = Math.min(b.saldo, +f.entrada || 0), desconto = +f.desconto || 0, acrescimo = +f.acrescimo || 0, taxa = (f.taxa === undefined || f.taxa === '' ? 0 : +f.taxa) / 100;
  const freq = f.freq || 'mensal', data = TISO, primeiroVenc = f.primeiroVenc || nextVenc(freq, data);
  const base = r2(Math.max(0, b.saldo - entrada + acrescimo - desconto));
  const L = { freq, data, primeiroVenc };
  const mpp = freq === 'unico' ? Math.max(1, Math.round((P(primeiroVenc) - P(data)) / 864e5 / 30)) : FREQ[freq].m;
  let n = freq === 'unico' ? 1 : Math.max(1, Math.floor(+f.n || 1));
  const desejada = +f.parcelaDesejada || 0;
  if (desejada > 0 && freq !== 'unico') { for (n = 1; n < 600; n++) { if (base * (1 + taxa * mpp * n) / n <= desejada + 0.005) break; } }
  const parcela = r2(base * (1 + taxa * mpp * n) / n), total = r2(parcela * n);
  const sched = schedule({ freq, primeiroVenc }, cfg().holSet, n);
  const principal = r2(b.saldo > 0 ? b.princ * (b.saldo - entrada) / b.saldo : 0);
  return { b, entrada, desconto, acrescimo, taxa, freq, primeiroVenc, base, n, parcela, total, sched, principal, juros: r2(total - base), dif: r2(total + entrada - b.saldo) };
}

async function rnConfirm(btn) {
  if (!S.db) return toast('Sem conexão com o banco.');
  const x = rnCalc(), sel = [...rnSel()]; if (!sel.length || x.base <= 0) return toast('Selecione contratos com saldo.');
  if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = `Confirmar: ${x.n} × ${R$(x.parcela)}`; return; }
  btn.disabled = true; const f = S.rn.f; CTX = { acao: 'Renegociação de ' + cliNome(S.rn.cli), lote: Math.random().toString(36).slice(2, 10) };
  const olds = S.emp.filter(L => sel.includes(L.id)).sort((a, b) => a.primeiroVenc.localeCompare(b.primeiroVenc));
  try {
    let resto = x.entrada; const entradas = [], trans = {};
    for (const L of olds) { const r = R(L.id); const pay = r2(Math.min(resto, r.saldo)); trans[L.id] = r2(r.saldo - pay);
      if (pay > 0) { const ref = await col('pagamentos').add({ emp: L.id, data: TISO, valor: pay, mora: 0, amort: 0, forma: f.forma || 'Pix', obs: 'Entrada da renegociação', criado: new Date().toISOString() }); entradas.push(ref.id); resto = r2(resto - pay); } }
    const desc = olds.map(L => { const r = R(L.id); return (r.n > 1 ? r.n + '×' + R$(r.parcela) : R$(r.saldo + 0)) ; }).join(' + ');
    const ref = await col('emprestimos').add({ cliente: S.rn.cli, valor: x.principal, data: TISO, modalidade: 'parcelado', freq: x.freq, n: x.n, primeiroVenc: x.primeiroVenc, taxa: x.taxa, parcela: x.parcela, situacao: 'renegociado',
      obs: `Renegociação de ${olds.length} contrato(s) (${desc}). ${f.obs || ''}`.trim(), criado: new Date().toISOString(),
      reneg: { data: TISO, origem: olds.map(L => L.id), entradas, saldoAnterior: x.b.saldo, entrada: x.entrada, acrescimo: x.acrescimo, desconto: x.desconto } });
    for (const L of olds) await col('emprestimos').doc(L.id).update({ situacao: 'substituido', sitAnterior: L.situacao || 'ativo', renegPara: ref.id, renegData: TISO, saldoTransferido: trans[L.id] });
    toast('Renegociação registrada'); S.rn = { cli: null, sel: null, q: '', f: {} }; location.hash = 'emprestimos'; S.filtro = 'ativos';
  } catch (e) { toast('Falha ao gravar a renegociação. Confira os contratos do cliente.'); btn.disabled = false; }

}
async function rnUndo(id) {

function nextVenc(freq, data) {

  if (freq === 'diaria') { let x = addD(d, 1); while (!isWork(x, cfg().holSet)) x = addD(x, 1); return ISO(x); }
  if (freq === 'semanal') return ISO(addD(d, 7)); if (freq === 'quinzenal') return ISO(addD(d, 15));
  if (freq === 'mensal5') { const b = addM(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)), 1); return ISO(nthWork(b.getUTCFullYear(), b.getUTCMonth(), 5, cfg().holSet)); }
  return ISO(addM(d, 1));
}

async function salvarArquivo(nome, texto, tipo) {
  const blob = new Blob([texto], { type: tipo });
  try { const file = new File([blob], nome, { type: tipo });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nome }); return true; } }
  catch (e) { if (e?.name === 'AbortError') { toast('Cancelado'); return false; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000); return true;
}
const COLS = ['clientes', 'emprestimos', 'pagamentos', 'caixa', 'fechamentos', 'pes_lanc', 'pes_inv', 'historico', 'config'];
function lerBackup(txt) {
  const o = JSON.parse(txt); let docs = o?.docs;
  if (!docs && o && typeof o === 'object') { // backup da versão anterior: listas por coleção
    docs = {}; const map = { clientes: 'clientes', emprestimos: 'emprestimos', pagamentos: 'pagamentos', caixa: 'caixa', fechamentos: 'fechamentos', pessoal_lancamentos: 'pes_lanc', pessoal_investimentos: 'pes_inv', historico: 'historico' };
    for (const [k, c] of Object.entries(map)) for (const d of o[k] || []) { const { id, ...r } = d; if (id) docs[c + '/' + id] = r; }
    if (o.config) { const { holSet, ...r } = o.config; docs['config/geral'] = r; } if (o.config_pessoal) docs['config/pessoal'] = o.config_pessoal;
  }
  if (!docs || typeof docs !== 'object') throw new Error('formato');
  const n = c => Object.keys(docs).filter(k => k.startsWith(c + '/')).length;
  if (!n('emprestimos') && !n('clientes') && !n('config')) throw new Error('vazio');
  return { docs, exportado: o.exportado || null, n };
}

  else if (d.newFec !== undefined) { render.reopen = null; sheetFech(null); }
  else if (d.fec) { render.reopen = null; sheetFech(d.fec); }
  else if (d.outros) { const f = $('#ffec'); f.elements.outros.value = d.outros; fecPreview(); }
  else if (d.delFec) { if (t.dataset.sure) { if (await W(() => col('fechamentos').doc(d.delFec).delete(), 'Fechamento excluído')) close(); } else { t.dataset.sure = 1; t.textContent = 'Toque de novo para excluir'; } }
  else if (t.id === 'calcMora') {
    const f = $('#fpag'), c = cfg(), base = +f.elements.valor.value || 0, dias = Math.max(0, Math.floor(+f.elements.dias.value || 0));
    let m = base * c.mora * dias; const capped = c.teto > 0 && m > c.teto * base; if (capped) m = c.teto * base; m = r2(m);
    f.elements.mora.value = m ? m.toFixed(2) : '';
    $('#moraInfo').textContent = dias ? `${R$(base)} × ${pct(c.mora)} × ${dias} dia${dias > 1 ? 's' : ''} = ${R$(m)}${capped ? ' (limitado pelo teto)' : ''}. Pode ajustar o valor antes de confirmar.` : 'Zero dias: recebimento sem mora.';
  }
  else if (d.pay) { setTimeout(payContaSync, 0); e.stopPropagation(); render.reopen = null; sheetPay(d.pay); }
  else if (d.newEmp !== undefined) { render.reopen = null; sheetEmpForm(null); if (d.newEmp) { const s = $('#femp').elements.cliente; s.value = d.newEmp; onCliChange(); } }
  else if (d.newCli !== undefined) { render.reopen = null; sheetCli(null); }
  else if (d.newMov !== undefined) { render.reopen = null; sheetMov(null); }
  else if (d.editEmp) { render.reopen = null; sheetEmpForm(d.editEmp); }
  else if (d.delPag) { if (t.dataset.sure) await W(() => col('pagamentos').doc(d.delPag).delete(), 'Pagamento excluído'); else { t.dataset.sure = 1; t.textContent = 'Confirmar?'; } }
  else if (d.delEmp) { if (t.dataset.sure) { const ps = S.pag.filter(p => p.emp === d.delEmp); if (await W(async () => { for (const p of ps) await col('pagamentos').doc(p.id).delete(); await col('emprestimos').doc(d.delEmp).delete(); }, 'Empréstimo excluído')) { close(); render.reopen = null; } } else { t.dataset.sure = 1; t.textContent = 'Toque de novo para excluir (apaga os pagamentos)'; } }
  else if (d.delCli) { if (S.emp.some(L => L.cliente === d.delCli)) return toast('Exclua ou transfira os empréstimos antes.'); if (t.dataset.sure) { if (await W(() => col('clientes').doc(d.delCli).delete(), 'Cliente excluído')) { close(); render.reopen = null; } } else { t.dataset.sure = 1; t.textContent = 'Toque de novo para excluir'; } }
  else if (d.delMov) { if (await W(() => col('caixa').doc(d.delMov).delete(), 'Movimento excluído')) close(); }
  else if (d.emp) { const id = d.emp; render.reopen = () => sheetEmp(id); sheetEmp(id); }
  else if (d.cli) { const id = d.cli; render.reopen = null; sheetCli(id); }
  else if (d.mov) { sheetMov(d.mov); }
  else if (t.id === 'bkp' || t.id === 'bkpc') {
    const data = JSON.stringify({ app: 'tavares-co', versao: 1, exportado: new Date().toISOString(), docs: LDB.dump() });
    if (t.id === 'bkpc') { try { await navigator.clipboard.writeText(data); toast('Backup copiado'); } catch (e) { toast('Não foi possível copiar'); } return; }
    if (await salvarArquivo(`tavares-backup-${TISO}.json`, data, 'application/json')) { await LDB.put('meta/app', { ...(LDB.get('meta/app') || {}), ultimoBackup: new Date().toISOString() }); toast('Backup gerado'); render(); }
  }
  else if (d.restoreOk !== undefined) restaurar();
  else if (d.zero !== undefined) { if (await W(() => dref('config', 'geral').set(Object.fromEntries(Object.entries(DEF).filter(([k]) => k !== 'holSet'))), 'Pronto. Comece cadastrando clientes e empréstimos.')) location.hash = 'inicio'; }
});
function onCliChange() { const f = $('#femp'); if (!f) return; const v = f.elements.cliente.value; $('#novoCliWrap').style.display = v === '__novo' ? 'block' : 'none';
  if (v && v !== '__novo' && !f.dataset.id) { const c = cliById(v); f.elements.taxa.value = +(((c?.vip ? cfg().taxaVip : cfg().taxa)) * 100).toFixed(2); simUpdate(); } }
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; render(); }
  else if (e.target.id === 'qc') { S.qc = e.target.value; render(); }
  else if (e.target.closest('#ffec')) fecPreview();
  else if (e.target.closest('#rnform')) { const nm = e.target.name; S.rn.f[nm] = e.target.value; if (nm === 'primeiroVenc') S.rn.f._pv = 1; if (nm === 'freq' && !S.rn.f._pv) { const v = e.target.value === 'unico' ? ISO(addM(TODAY, 1)) : nextVenc(e.target.value, TISO); S.rn.f.primeiroVenc = v; $('#rnform [name=primeiroVenc]').value = v; } rnUpdate(); }
  else if (e.target.id === 'rnq') { S.rn.q = e.target.value; render(); }
  else if (e.target.id === 'hq') { S.h.q = e.target.value; render(); }
  else if (e.target.id === 'hmes') { S.h.mes = e.target.value; render(); }
  else if (e.target.closest('#femp')) { if (e.target.name === 'cliente') onCliChange(); if (e.target.name === 'freq' || e.target.name === 'data') { const f = $('#femp'); if (!f.dataset.id) f.elements.primeiroVenc.value = f.elements.freq.value === 'unico' ? ISO(addM(P(f.elements.data.value || TISO), 1)) : nextVenc(f.elements.freq.value, f.elements.data.value); } simUpdate(); }
});
document.addEventListener('change', async e => {
  if (e.target.dataset.sit) { const id = e.target.dataset.sit; await W(() => col('emprestimos').doc(id).update({ situacao: e.target.value }), 'Situação atualizada'); }
  else if (e.target.name === 'cliente' && e.target.closest('#femp')) onCliChange();
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, g = n => f.elements[n]?.value ?? '';
  if (f.id === 'femp') {
    let cid = g('cliente');
    if (cid === '__novo') { const nome = g('novoCli').trim(); if (!nome) return toast('Informe o nome do cliente.'); if (S.cli.some(c => c.nome.toLowerCase() === nome.toLowerCase())) return toast('Já existe cliente com esse nome.');
      if (!S.db) return toast('Sem conexão com o banco.'); try { const ref = await col('clientes').add({ nome, vip: false, sit: 'ativo', criado: TISO }); cid = ref.id; } catch (er) { return toast('Falha ao criar cliente.'); } }
    if (!cid) return toast('Selecione o cliente.');
    const body = { cliente: cid, valor: num(g('valor')), data: g('data'), modalidade: g('modalidade'), freq: g('freq'), n: g('freq') === 'unico' || g('modalidade') === 'rotativo' ? 1 : Math.max(1, num(g('n'))),
      primeiroVenc: g('primeiroVenc'), taxa: num(g('taxa')) / 100, parcela: num(g('parcela')), obs: g('obs').trim() };
    if (f.elements.conta) body.conta = g('conta');
    if (!(body.valor > 0)) return toast('Informe o valor.');
    const id = f.dataset.id;
    if (await W(() => id ? col('emprestimos').doc(id).update(body) : col('emprestimos').add({ ...body, situacao: 'ativo', criado: new Date().toISOString() }), id ? 'Empréstimo atualizado' : 'Empréstimo registrado')) { close(); render.reopen = null; }
  } else if (f.id === 'fpag') {
    const body = { emp: f.dataset.eid, data: g('data'), valor: num(g('valor')), mora: num(g('mora')), amort: num(g('amort')), forma: g('forma'), ...(() => { const [lado, id] = (g('conta') || 'e:' + CT_E()[0].id).split(/:(.*)/); return lado === 'p' ? { contaPes: id, destino: 'pessoal' } : { conta: id }; })(), obs: g('obs').trim(), criado: new Date().toISOString() };
    if (body.valor + body.mora + body.amort <= 0) return toast('Informe um valor.');
    if (await W(() => col('pagamentos').add(body), 'Recebimento registrado')) { close(); render.reopen = null; }
  } else if (f.id === 'fcli') {
    const nome = g('nome').trim(); if (!nome) return toast('Informe o nome.'); const id = f.dataset.id;
    if (S.cli.some(c => c.id !== id && c.nome.toLowerCase() === nome.toLowerCase())) return toast('Já existe cliente com esse nome.');
    const body = { nome, tel: g('tel').trim(), cpf: g('cpf').trim(), end: g('end').trim(), ref: g('ref').trim(), indic: g('indic').trim(), ocup: g('ocup').trim(), renda: num(g('renda')), garantia: g('garantia').trim(), vip: f.elements.vip.checked, sit: g('sit'), obs: g('obs').trim() };
    if (await W(() => id ? col('clientes').doc(id).update(body) : col('clientes').add({ ...body, criado: TISO }), id ? 'Cliente atualizado' : 'Cliente cadastrado')) { close(); }
  } else if (f.id === 'fmov') {
    const body = { tipo: g('tipo'), data: g('data'), valor: num(g('valor')), desc: g('desc').trim(), conta: g('conta') }; const id = f.dataset.id;
    if (!(body.valor > 0)) return toast('Informe o valor.');
    if (body.tipo === 'aporte' || body.tipo === 'retirada') body.contaPes = g('contaPes');
    if (body.tipo === 'transf') { body.contaDest = g('contaDest'); if (body.contaDest === body.conta) return toast('Escolha contas diferentes.'); }
    if (await W(() => id ? col('caixa').doc(id).update(body) : col('caixa').add(body), 'Movimento salvo')) close();
  } else if (f.id === 'fpl') {
    const tipo = g('tipo'), id = f.dataset.id, body = { tipo, data: g('data'), valor: num(g('valor')), desc: g('desc').trim() };
    if (!(body.valor > 0)) return toast('Informe o valor.');
    if (tipo === 'cartao') { body.cartao = g('cartao'); body.mesRef = g('mesRef'); body.pago = f.elements.pago.checked; }
    if (tipo === 'aporte' || tipo === 'resgate') { body.inv = g('inv'); if (!body.inv) return toast('Escolha o investimento.'); }
    if (f.elements.conta) body.conta = g('conta');
    if (tipo === 'transf') { body.contaDest = g('contaDest'); if (body.contaDest === body.conta) return toast('Escolha contas diferentes.'); }
    if (await W(() => id ? col('pes_lanc').doc(id).set(body) : col('pes_lanc').add({ ...body, criado: new Date().toISOString() }), 'Lançamento salvo')) close();
  } else if (f.id === 'finv') {
    const id = f.dataset.id, body = { nome: g('nome').trim(), inst: g('inst').trim(), meta: num(g('meta')) };
    if (!body.nome) return toast('Informe o nome.');
    const novoSaldo = g('saldo');
    if (!id) { body.saldoBase = num(novoSaldo); body.dataBase = TISO; }
    else if (novoSaldo !== '') { body.saldoBase = num(novoSaldo); body.dataBase = TISO; }
    if (await W(() => id ? col('pes_inv').doc(id).update(body) : col('pes_inv').add(body), 'Investimento salvo')) close();
  } else if (f.id === 'fpcfg') {
    const contas = lerContas(f); if (!contas.length) return toast('Cadastre pelo menos uma conta.');
    const body = { contas, saldoInicial: r2(contas.reduce((s, k) => s + k.saldo, 0)), dataSaldo: g('dataSaldo') || TISO, salario: num(g('salario')) };
    if (await W(() => dref('config', 'pessoal').set(body), 'Ajustes pessoais salvos')) close();
  } else if (f.id === 'ftrf') {
    const [a, ca] = g('de').split(':'), [b, cb] = g('para').split(':'), valor = num(g('valor')), data = g('data'), desc = g('desc').trim();
    if (!(valor > 0)) return toast('Informe o valor.'); if (a === b && ca === cb) return toast('Escolha contas diferentes.');
    const ok = await W(() => a === 'e' && b === 'e' ? col('caixa').add({ tipo: 'transf', conta: ca, contaDest: cb, valor, data, desc })
      : a === 'p' && b === 'p' ? col('pes_lanc').add({ tipo: 'transf', conta: ca, contaDest: cb, valor, data, desc, criado: new Date().toISOString() })
      : a === 'e' ? col('caixa').add({ tipo: 'retirada', conta: ca, contaPes: cb, valor, data, desc })
      : col('caixa').add({ tipo: 'aporte', conta: cb, contaPes: ca, valor, data, desc }), 'Transferência registrada');
    if (ok) close();
  } else if (f.id === 'ffec') {
    const mes = g('mes'); if (!/^\d{4}-\d{2}$/.test(mes)) return toast('Informe o mês.');
    const C = capitalAgora(num(g('outros'))), [y, m] = mes.split('-').map(Number), st = statsMes(ISO(new Date(Date.UTC(y, m - 1, 1))), ISO(new Date(Date.UTC(y, m, 0))));
    const body = { mes, data: TISO, caixa: r2(C.caixa), aReceber: r2(C.aReceber), principal: r2(C.principal), parado: r2(C.parado), outros: num(g('outros')), capitalTotal: r2(C.total),
      recebido: r2(st.rec), emprestado: r2(st.conc), juros: r2(st.juros), obs: g('obs').trim(), origem: 'app' };
    if (await W(() => col('fechamentos').doc(mes).set(body), 'Fechamento de ' + mesLab(mes) + ' salvo')) close();
  } else if (f.id === 'fcfg') {
    const fer = g('feriados').split(/\s+/).map(s => s.trim()).filter(s => /^\d{4}-\d{2}-\d{2}$/.test(s));
    const body = { taxa: num(g('taxa')) / 100, taxaVip: num(g('taxaVip')) / 100, mora: num(g('mora')) / 100, teto: num(g('teto')), tolerancia: num(g('tolerancia')), limInad: num(g('limInad')) || 30, dataSaldo: g('dataSaldo') || DEF.dataSaldo, feriados: fer };
    body.contas = lerContas(f); if (!body.contas.length) return toast('Cadastre pelo menos uma conta da empresa.'); body.saldoInicial = r2(body.contas.reduce((s, k) => s + k.saldo, 0));
    await W(() => dref('config', 'geral').set(body), 'Ajustes salvos');
  }
});

/* ---------- conexão ---------- */
render();
const sync = (cls, txt) => { const s = $('#sync'); s.className = 'sync ' + cls; s.querySelector('span').textContent = txt; };
const ban = t => { const b = $('#banner'); b.textContent = t; b.style.display = t ? 'block' : 'none'; };
(async () => {
  try { await LDB.init(); } catch (e) { console.error(e); sync('err', 'erro'); ban('Não foi possível abrir o armazenamento deste aparelho. Feche o app e abra de novo pelo ícone da tela inicial.'); return; }
  const db = LDB.db; S.db = db;
  let agendado = 0; const rr = () => { if (agendado) return; agendado = requestAnimationFrame(() => { agendado = 0; render(); }); };
  const sub = (name, key) => db.collection(name).onSnapshot(snap => { S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })); rr(); });
  sub('clientes', 'cli'); sub('emprestimos', 'emp'); sub('pagamentos', 'pag'); sub('caixa', 'cx'); sub('fechamentos', 'fec'); sub('pes_lanc', 'pl'); sub('pes_inv', 'inv'); sub('historico', 'hist');
  db.doc('config/pessoal').onSnapshot(s => { S.pcfg = s.exists ? s.data() : null; rr(); });
  db.doc('config/geral').onSnapshot(s => { S.cfg = s.exists ? s.data() : null; rr(); });
  S.pronto = true; sync('on', 'local'); render();
  try { if (navigator.storage?.persist) S.persist = (await navigator.storage.persisted()) || (await navigator.storage.persist()); if (navigator.storage?.estimate) S.uso = (await navigator.storage.estimate()).usage; } catch (e) {}
  if (route() === 'ajustes') render();
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const tinhaSW = !!navigator.serviceWorker.controller; let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (tinhaSW && !recarregou) { recarregou = true; location.reload(); } });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {}));
}
}
